# OSS fixture manifest for the ground-truth e2e (WS5).
#
# Three real, open-source Linux tools with available source. The GATED fixtures-build job
# (build_fixtures.py, run only in the dedicated e2e workflow — never in the hermetic unit job)
# fetches each pinned tarball, VERIFIES its SHA-256 (fail closed), builds it WITH DWARF and a
# non-PIE layout (`-g -no-pie`, so symbol addresses == the addresses Ghidra reports for the
# stripped copy), extracts the call-graph ground truth (extract_ground_truth.py), then STRIPS a
# copy to feed Ghidra. The hermetic e2e consumes only the resulting {stripped binary + truth JSON}
# artifact — no network, no toolchain at test time.
#
# SUPPLY CHAIN (std-supplychain / workflow-cve-management): each `sha256` is pinned. The values
# below are GATED placeholders (`REPLACE_WITH_SHA256_*`) resolved by a maintainer (or the job's
# pin step) against the upstream release BEFORE the fixtures build runs — identical convention to
# the Ghidra-zip and action-digest pins elsewhere in this repo. build_fixtures.py FAILS CLOSED on
# any unresolved placeholder.

schema = "ghidra-mcp/e2e-fixtures/1"

# --- cJSON: single-file MIT JSON parser; small, rich internal call graph (parse_*/print_*). -----
[[tool]]
name = "cjson"
version = "1.7.18"
url = "https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.18.tar.gz"
sha256 = "3aa806844a03442c00769b83e99970be70fbef03735ff898f4811dd03b9f5ee5"
build = "single-file"          # compile listed sources + the committed driver into one binary
sources = ["cJSON.c"]          # relative to the extracted source root
driver = "driver_cjson.c"      # committed here (tests/fixtures/oss/) — provides main()
target_name = "cjson_fixture"  # output binary basename

# --- zlib: analyze `minigzip` (the bundled gzip-ish tool → deflate/inflate/crc call graph). -----
# Robust build: zlib's own hand-written `./configure --static` (NOT autotools/gnulib) builds only
# libz.a (no .so), so the global -no-pie is safe; `make minigzip` links a non-PIE ET_EXEC.
[[tool]]
name = "zlib"
version = "1.3.1"
url = "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
build = "zlib"                 # CFLAGS=... ./configure --static ; make <target>
target = "minigzip"            # built binary (also the make target name)
target_name = "minigzip"

# --- lua: analyze the `lua` interpreter (rich VM + stdlib call graph). ---------------------------
# Robust build: a plain hand-written Makefile (NO autotools); `make posix` builds a static
# ET_EXEC. Flags injected via MYCFLAGS/MYLDFLAGS (lua's documented user-flag hooks).
[[tool]]
name = "lua"
version = "5.4.7"
url = "https://www.lua.org/ftp/lua-5.4.7.tar.gz"
sha256 = "9fbf5e28ef86c69858f6d3d34eccc32e911c1a28b4120ff3e84aaa70cfbf1e30"
build = "lua"                  # make posix MYCFLAGS=... MYLDFLAGS=...
target = "src/lua"             # built interpreter binary
target_name = "lua"
