# =============================================================================
# live-regression.yml — recurring real-worker regression gate (ADR-028; GATED by label/schedule)
# =============================================================================
# Catches JVM-edge (`# pragma: no cover`) regressions that hermetic unit tests CANNOT — the v1.3
# F2/F7 class — by driving the REAL Ghidra worker end to end. Unit coverage stops at the TB3
# PyGhidra boundary (ADR-001); only a live worker exercises the export-after-write enumeration.
#
# HARD GATES (deterministic — a failure or a SKIP fails the job):
#   * F2 — `session_export_annotations` succeeds on a real program after a rename
#     (tests/integration/test_export_annotations_after_rename.py — scheduled, not rewritten).
#   * F7 — a session making exactly 1 rename + 1 comment + 1 struct exports EXACTLY 3 entries and
#     ZERO auto-generated content (tests/integration/test_export_known_count.py).
#   * Analyzer profiles (ADR-029 B) — `session_analyze` under each of {default,light,deep} succeeds
#     and populates a function surface (tests/integration/test_analyze_profiles.py, 3 params). Only
#     light/deep drive the option-overlay JVM edge (getOptions(ANALYSIS_PROPERTIES)+setBoolean),
#     which `default` (empty overlay) skips — so this is the sole recurring guard for that binding.
#   * FID — `identify_functions` runs the Function ID service on a real worker and returns a
#     well-formed, bounded result (tests/integration/test_identify_functions_fid.py, ADR-042 Phase 1).
#     Guards the `processProgram(Program, FidQueryService, float, TaskMonitor)` JVM-edge binding (the
#     live test already caught a wrong-arity call). ELF micro-binary → 0 MSVC-DB matches (empty OK).
#   * FID self-match — a self-built FID DB makes a micro-binary self-match, exercising the NON-EMPTY
#     inner loop (getFunctionRecord/getLibraryRecord/getOverallScore) + the headless custom-`.fidb`
#     ingest+attach+activate chain, i.e. Phase-2 SPIKE-1 (tests/integration/
#     test_identify_functions_selfmatch.py). Hermetic — DB from the binary's own functions, no MSVC/
#     licensing.
#
# ADVISORY (not a hard gate YET): FID ELF bundled-DB match (ADR-043 Phase 2) — a zlib-static ELF
# matches the BUNDLED zlib FID DB via the worker-startup attach
# (tests/integration/test_identify_functions_elf_match.py). It SKIPs until the PM generates +
# bundles the zlib `.fidbf` into the worker image (scripts/fid/generate_fidb.py + Containerfile.worker
# COPY deploy/fid/), so it runs in the ADVISORY step below (its skip must NOT fail the hard-gate
# guard). PROMOTE to a hard gate (move into the hard-gate run + bump the >=5 expectation, and flip the
# test's "DB not bundled" skip to a hard assert) ONCE the zlib DB ships in the image.
# Naming-accuracy / behavioral-equivalence is ADVISORY (NOT a hard gate, NOT run with an LLM in CI)
# and is deliberately NOT part of this job — see e2e-groundtruth.yml for the gated naming-eval e2e.
# Per-profile recovered-function counts are recorded into the JUnit XML as an advisory trend.
#
# FAIL-LOUD ON SKIP (workflow-cicd: a skipped/errored security stage counts as a FAILURE, not a
# pass): if any hard-gate test is SKIPPED (broken harness / worker didn't come up) the job FAILS.
# We assert post-run that all hard-gate tests actually RAN (parse the JUnit XML; expect >=5).
#
# TEST WHAT YOU SHIP: by default this PULLS the cosign-SIGNED released worker image and
# cosign-VERIFIES it before use; a `workflow_dispatch` input (or a pull failure) falls back to
# building from the digest-pinned Containerfile.worker.
#
# CI ISOLATION RELAXATION (CI-only): GitHub runners lack gVisor/runsc (the prod strong-isolation
# runtime, ADR-004), so the worker runs under crun. EVERY OTHER ADR-004 floor still holds (non-root,
# read-only rootfs, dropped caps, `--network none`, seccomp) and the input is a BENIGN, locally-built
# micro-binary (master §5 — no real malware). Production keeps runsc/gVisor (deploy/README.md).
#
# Cadence: nightly cron + manual dispatch + PRs that TOUCH a FID path OR a CORE runtime path (auto,
# via the `changes` detector — #160 / N2) + ANY PR manually carrying the `live-regression` label
# (force-escape). It does NOT run on EVERY PR (the real-worker run is expensive) — only FID-/core-path
# PRs auto-trigger it, so a real-worker regression is caught at merge time and not just on the nightly
# run. A failed scheduled run is still the catch-all alert (GitHub notifies the repo owner of
# default-branch scheduled-workflow failures), mirroring scheduled-rescan.yml.
#
# NOTE (#160 → promoted): this job runs per-PR on FID paths (path-filtered, same-repo only) AND the
# `fid-elf-match-gate` context is a branch-protection `required_status_check` on `main` — a failing
# same-toolchain ELF match blocks merge. Cross-toolchain matching stays advisory (ADR-043).
#
# NOTE (N2): the CORE-path auto-trigger broadens WHEN the real-worker suite RUNS (it now fires on
# same-repo PRs touching src/vivarium/{ghidra,server,sessions,tools,jobs}/** + Containerfile.worker),
# so a real-worker regression on a core surface is surfaced on the PR. It is deliberately NOT (yet)
# wired into the blocking `fid-elf-match-gate` required check — that gate still enforces ONLY the FID
# deterministic match. Making a ~60-min real-worker run a hard merge-blocker for every core PR is a
# separate policy decision (operator call); until then the broadened run is a visible per-PR signal.

name: live-regression

on:
  schedule:
    - cron: "41 4 * * *" # nightly 04:41 UTC (off-peak, off the top-of-hour load spike)
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build the worker image from Containerfile.worker instead of pulling the signed release"
        type: boolean
        default: false
        required: false
  pull_request:
    # Auto-run on PRs that TOUCH a FID path (opened/synchronize/reopened) via the `changes`
    # detector + the job `if:` guard below (#160) — so a FID-match regression is caught at merge
    # time, not just on the nightly run. `labeled` is retained as a manual force-escape: applying
    # the `live-regression` label runs the FULL real-worker suite on ANY PR regardless of paths.
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read # least privilege; nothing is pushed

concurrency:
  group: live-regression-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Cheap pre-flight (#160): on a PR, decide whether any FID-relevant path changed. The expensive
  # real-worker job below auto-runs only when this says `fid == 'true'`, so non-FID PRs never spin
  # up the worker. Self-contained `git diff` (no third-party action to vet/pin); base..head two-dot
  # is FAIL-SAFE — it can only OVER-trigger (run the gate when not strictly needed), never miss a
  # FID change. Runs on PRs only; for schedule/dispatch it is skipped and the guard below ignores it.
  changes:
    name: detect FID-path changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fid: ${{ steps.filter.outputs.fid }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
        with:
          fetch-depth: 0 # need both base and head commits to diff
      - name: Detect FID- and core-path changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Ensure both endpoints are present locally (base lives on the target branch).
          git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          # FAIL-SAFE: if the diff cannot be computed (missing object on a fork PR, etc.), assume BOTH
          # a FID and a core change so the run HAPPENS rather than silently being skipped (fail-safe,
          # not fail-open).
          if ! files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            echo "::warning::could not diff $BASE_SHA..$HEAD_SHA — assuming FID+core change (fail-safe)"
            echo "fid=true" >> "$GITHUB_OUTPUT"
            echo "core=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$files"
          fid=false
          core=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # FID paths: a subset that also drives the same-toolchain deterministic probe build.
            case "$f" in
              Containerfile.worker | \
              scripts/fid/* | \
              deploy/fid/* | \
              src/vivarium/*fid* | \
              tests/integration/test_identify_functions* | \
              .github/workflows/live-regression.yml)
                fid=true ;;
            esac
            # CORE paths (N2): runtime surfaces whose JVM-edge / real-worker behavior hermetic unit
            # tests cannot reach (ADR-001 stops at the PyGhidra boundary). A change here should
            # exercise the REAL worker, not just FID changes. Containerfile.worker + the workflow
            # itself are already FID paths (covered above) and so always trigger.
            case "$f" in
              src/vivarium/ghidra/* | \
              src/vivarium/server/* | \
              src/vivarium/sessions/* | \
              src/vivarium/tools/* | \
              src/vivarium/jobs/* | \
              Containerfile.worker | \
              .github/workflows/live-regression.yml)
                core=true ;;
            esac
          done <<< "$files"
          echo "fid=$fid" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "::notice::FID-path change: $fid | core-path change: $core"

  live-regression:
    # Run when: scheduled, manually dispatched, a SAME-REPO PR that TOUCHES a FID path (auto — #160)
    # OR a CORE runtime path (auto — N2: src/vivarium/{ghidra,server,sessions,tools,jobs}/** +
    # Containerfile.worker — the real-worker / JVM-edge surfaces hermetic unit tests cannot reach,
    # ADR-001), OR ANY PR manually carrying the `live-regression` label (force-escape; the `labeled`
    # event also fires for OTHER labels, so gate on the specific name). `!cancelled()` keeps this job
    # evaluating its `if:` even though the `changes` dependency is SKIPPED on schedule/dispatch (a
    # skipped need would otherwise skip this job too). FAIL-SAFE: the `needs.changes.result ==
    # 'failure'` clause runs the gate when the `changes` detector itself FAILED at the job level
    # (checkout/OOM/etc.) — so a broken detector errs toward RUNNING the gate, never silently skipping
    # it (complements the in-step diff-failure fail-safe).
    #
    # FORK-PR HARDENING (threat-model §4 delta, post-#161 re-analysis): the AUTO branches
    # (`fid == 'true'`, `core == 'true'`, and detector-`failure`) are gated to **same-repo** PRs via
    # `head.repo.full_name == github.repository`. This job pulls images and `podman build`s +
    # `pytest`-runs PR-supplied content (Containerfile.worker / FID probe + test sources); a fork PR
    # auto-triggering it would run fork-influenced content in the runner without a human in the loop
    # (Medium: runner code-exec in a credential-less ephemeral runner + Actions-minute cost-DoS — it
    # is `pull_request` not `pull_request_target`, so no secret/token/prod exposure). Fork PRs are
    # therefore left to the maintainer-`label` path (applying `live-regression` IS the human gate).
    # Same-repo PRs auto-run at the existing contributor trust level (no new exposure). Pairs with the
    # repo Actions setting "Require approval for all outside collaborators" as a platform backstop.
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.label.name == 'live-regression') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         (needs.changes.outputs.fid == 'true' || needs.changes.outputs.core == 'true')) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         needs.changes.result == 'failure')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read # pull the worker image from GHCR
      id-token: write # cosign keyless verify of the pulled image
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
        with:
          lfs: true # fetch the OpenSSL golden-fixture binary (samples/**/*.blind) for the advisory test

      # End-user status reporting (ADR-039): annotate the run page, append to the job summary, and
      # push to ntfy if STATUS_NTFY_URL is set, so dispatched/scheduled runs are no longer silent.
      - name: Notify start
        uses: ./.github/actions/run-status
        with:
          phase: start
          message: "started — run ${{ github.run_id }} (${{ github.event_name }} on ${{ github.ref_name }})"
          ntfy-url: ${{ secrets.STATUS_NTFY_URL }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install toolchain (hash-pinned dev lockfile only — no unpinned fetch)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Hash-pinned dev deps ONLY; the package runs from `src/` via PYTHONPATH (set on the run
          # step below), inherited by the spawned `python -m vivarium`. No editable install → no
          # unpinned build-backend fetch. requirements-dev.lock = pip-compile --extra=dev --generate-hashes.
          pip install --require-hashes -r requirements-dev.lock

      # --- Acquire the worker image: PULL+VERIFY the signed release, else BUILD from the pin -------
      # `build_image` dispatch input forces a build; otherwise pull the signed digest + cosign-verify
      # it ("test what you ship"); a pull failure falls back to a local build from the pinned
      # Containerfile so the gate still runs (build is local-only — never pushed/signed here).
      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_image) }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_image) }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # sigstore/cosign-installer@v4.1.2

      - name: Acquire worker image (verify+pull signed release, else build from pin)
        id: image
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
          # Legacy fallback only: the trusted pin now lives in the committed file
          # .github/worker-image.pin (auto-bumped via a reviewed PR by worker-image.yml on release).
          WORKER_IMAGE_DIGEST_VAR: ${{ vars.WORKER_IMAGE_DIGEST }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          GHIDRA_VERSION: ${{ vars.GHIDRA_VERSION }}
          GHIDRA_RELEASE_TAG: ${{ vars.GHIDRA_RELEASE_TAG }}
          GHIDRA_ZIP_URL: ${{ vars.GHIDRA_ZIP_URL }}
          GHIDRA_ZIP_SHA256: ${{ vars.GHIDRA_ZIP_SHA256 }}
        run: |
          set -euo pipefail

          build_local() {
            echo "::notice::building worker image locally from the digest-pinned Containerfile.worker"
            podman build \
              --build-arg "GHIDRA_VERSION=${GHIDRA_VERSION:-}" \
              --build-arg "GHIDRA_RELEASE_TAG=${GHIDRA_RELEASE_TAG:-}" \
              --build-arg "GHIDRA_ZIP_URL=${GHIDRA_ZIP_URL:-}" \
              --build-arg "GHIDRA_ZIP_SHA256=${GHIDRA_ZIP_SHA256:-}" \
              -f Containerfile.worker -t "localhost/vivarium-worker:live-regression" .
            echo "image=localhost/vivarium-worker:live-regression" >> "$GITHUB_OUTPUT"
          }

          if [ "${FORCE_BUILD}" = "true" ]; then
            build_local
            exit 0
          fi

          # Resolve the trusted worker-image digest. Source of truth: the committed pin file
          # .github/worker-image.pin (auto-bumped by a reviewed PR from worker-image.yml on each
          # release). Fall back to the legacy repo variable, then to a local build.
          PIN_FILE=".github/worker-image.pin"
          DIGEST=""
          if [ -f "${PIN_FILE}" ]; then
            DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' "${PIN_FILE}" | head -n1 || true)"
          fi
          [ -z "${DIGEST}" ] && DIGEST="${WORKER_IMAGE_DIGEST_VAR:-}"

          if [ -z "${DIGEST}" ]; then
            echo "::warning::no worker-image pin (.github/worker-image.pin / vars.WORKER_IMAGE_DIGEST) — local build"
            build_local
            exit 0
          fi

          WORKER_IMAGE="ghcr.io/${OWNER}/vivarium-worker@${DIGEST}"
          # Keyless cosign verify scoped to THIS repo's worker-image.yml OIDC identity before trust.
          # A pinned digest is present, so the released artifact MUST verify: a verify FAILURE means a
          # tampered/unsigned image (supply-chain integrity failure) and is FAILED LOUD — never masked
          # by a silent local-build fallback (that fallback is only for the expected digest-unset /
          # force-build paths handled above). "Test what you ship" — or fail.
          if ! cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/worker-image.yml@" \
              "${WORKER_IMAGE}"; then
            echo "::error::cosign verify FAILED for the released worker image ${WORKER_IMAGE} —" \
                 "refusing to fall back to a local build (possible supply-chain tampering)."
            exit 1
          fi
          podman pull "${WORKER_IMAGE}"
          echo "image=${WORKER_IMAGE}" >> "$GITHUB_OUTPUT"

      # --- Build + extract the same-toolchain FID probes (deterministic ELF-match hard gate) -------
      # Compile zlib + musl consumers with the worker image's OWN pinned toolchain (the `fid-probes`
      # Containerfile stage: digest-pinned wolfi gcc + pinned library source — the same that produced
      # the bundled .fidbf), so the FID match is DETERMINISTIC and the gate can assert a hard >=N count
      # (vs the host-compiled, cross-toolchain advisory test). The probes are NOT shipped (a static
      # probe would trip image-SCA on embedded-lib CVEs); they are built here on the fly and imported
      # through the real worker. The `fid-probes` stage depends only on zlib-build/musl-build (no
      # Ghidra), so this is a cheap compile — no Ghidra download. ADR-043.
      #
      # SELF-ACTIVATING: the deterministic hard gate only applies when the worker image UNDER TEST
      # actually ships the bundled FID DBs. The lane pulls the PINNED RELEASED image, which may predate
      # FID Phase 2 (no /opt/vivarium/fid/*.fidbf) — in that window the gate SKIPS (warn, excluded from
      # the fail-loud count), and auto-upgrades to a hard >=N gate once a FID-containing image is
      # released + pinned. This avoids reding the lane during the release lag.
      - name: Build + extract same-toolchain FID probes (deterministic gate, self-activating)
        env:
          WORKER_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if ! podman run --rm --entrypoint sh "$WORKER_IMAGE" -c \
               'test -f /opt/vivarium/fid/zlib.fidbf && test -f /opt/vivarium/fid/musl.fidbf'; then
            echo "::warning::worker image ${WORKER_IMAGE} has no bundled zlib/musl FID DBs (pre-FID" \
                 "release) — deterministic ELF-match gate SKIPPED until a FID-containing worker image" \
                 "is released + pinned"
            echo "FID_DETERMINISTIC_GATE=0" >> "$GITHUB_ENV"
            exit 0
          fi
          podman build --target fid-probes \
            -f Containerfile.worker -t "localhost/vivarium-fid-probes:live-regression" .
          PROBE_DIR="/tmp/gmcp-fid-probes"
          mkdir -p "$PROBE_DIR"
          cid="$(podman create localhost/vivarium-fid-probes:live-regression)"
          podman cp "$cid:/opt/fid-probes/zlib_probe" "$PROBE_DIR/zlib_probe"
          podman cp "$cid:/opt/fid-probes/musl_probe" "$PROBE_DIR/musl_probe"
          podman rm "$cid" >/dev/null
          ls -l "$PROBE_DIR"
          # DBs present → activate the hard gate. $GITHUB_ENV persists both to the pytest + assert steps.
          echo "VIVARIUM_FID_PROBE_DIR=$PROBE_DIR" >> "$GITHUB_ENV"
          echo "FID_DETERMINISTIC_GATE=1" >> "$GITHUB_ENV"

      # --- Run the F2 + F7 + profile HARD GATES against the real worker ---------------------------
      - name: Run F2 + F7 + analyzer-profile live regression (real worker under crun)
        env:
          # Run the package from src/ (no editable install — nothing unpinned fetched); inherited by
          # the spawned `python -m vivarium` server via os.environ.
          PYTHONPATH: src
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_WORKER_IMAGE: ${{ steps.image.outputs.image }}
          VIVARIUM_CONTAINER_ENGINE: podman
          # CI-only isolation relaxation: stock runners have no gVisor (runsc); run under crun and
          # keep every other ADR-004 floor. Prod keeps runsc/gVisor (deploy/README.md). See header.
          VIVARIUM_WORKER_RUNTIME: crun
          # Generous client read timeout (JVM boot + auto-analysis on a real binary).
          VIVARIUM_E2E_TIMEOUT: "900"
          # Don't idle/TTL-evict the session mid-run on a slow runner.
          VIVARIUM_SESSION_TTL_SECONDS: "1800"
          VIVARIUM_SESSION_IDLE_SECONDS: "1800"
        run: |
          set -euo pipefail
          # The harness drives a HOST-run server (the F7 test builds its own micro-binary into a
          # tmp import root). Under rootless podman + --userns keep-id the worker must run as THIS
          # runner's uid/gid to write the server-created per-session socket dir (0700), and the
          # socket dir must be SHORT (the per-session UDS path must fit AF_UNIX ~107 bytes). In
          # production the server is containerized as 65532 and these stay at hardened defaults
          # (deploy/socket-dir.md, ADR-009).
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_IMPORT_ROOT="/tmp/gmcp-imports"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR" "$VIVARIUM_IMPORT_ROOT"
          # Include the deterministic FID gate only when self-activated (worker image ships the DBs);
          # otherwise it is omitted entirely (no skip → the fail-loud guard stays satisfied).
          DETERMINISTIC=""
          if [ "${FID_DETERMINISTIC_GATE:-0}" = "1" ]; then
            DETERMINISTIC="tests/integration/test_identify_functions_deterministic.py"
          else
            echo "::notice::deterministic FID gate inactive (worker image lacks bundled DBs) — omitted this run"
          fi
          pytest -m integration --no-cov -v \
            --junit-xml=live-regression-junit.xml \
            tests/integration/test_export_annotations_after_rename.py \
            tests/integration/test_export_known_count.py \
            tests/integration/test_analyze_profiles.py \
            tests/integration/test_identify_functions_fid.py \
            tests/integration/test_identify_functions_selfmatch.py \
            ${DETERMINISTIC}

      # --- FAIL-LOUD ON SKIP: a skipped hard gate is a FAILURE, not a silent pass ------------------
      - name: Assert all hard gates actually RAN (fail-loud on skip)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f live-regression-junit.xml ]; then
            echo "::error::no JUnit report — pytest did not run; the live-regression gate is BROKEN"
            exit 1
          fi
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("live-regression-junit.xml")
          root = tree.getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]

          tests = errors = failures = skipped = 0
          for s in suites:
              tests += int(s.get("tests", 0))
              errors += int(s.get("errors", 0))
              failures += int(s.get("failures", 0))
              skipped += int(s.get("skipped", 0))

          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          problems = []
          # Always-on hard gates: F2 (export-after-rename, 1) + F7 (known-count, 1) + analyzer-profile
          # params (default/light/deep, 3) + FID well-formed (1) + FID self-match (1) = 7. The
          # deterministic same-toolchain FID gate (zlib + musl, 2) is SELF-ACTIVATING: included only
          # when the worker image ships the bundled DBs (FID_DETERMINISTIC_GATE=1), so the expected
          # floor is 9 then, 7 otherwise. When inactive the test is omitted (not skipped), so the
          # zero-skip rule below still holds.
          import os
          expected = 9 if os.environ.get("FID_DETERMINISTIC_GATE", "0") == "1" else 7
          if tests < expected:
              problems.append(f"expected >={expected} hard-gate tests to run, collected {tests}")
          if skipped:
              problems.append(f"{skipped} hard-gate test(s) SKIPPED — a skipped gate is a FAILURE")
          if failures or errors:
              problems.append(f"{failures} failure(s) + {errors} error(s) in the hard gates")
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("both hard gates ran and passed")
          PY

      - name: Upload JUnit report
        if: always() # keep the report for triage even when the gate fails
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: live-regression-junit
          path: live-regression-junit.xml

      # --- ADVISORY: OpenSSL blind golden fixture (not a hard gate) --------------------------------
      # Promotes samples/openssl-blind-analysis/ into a regression check: re-run the real analysis
      # against the LFS-committed subject binary (samples/openssl-blind-analysis/openssl.blind,
      # fetched by the lfs:true checkout) and assert it reproduces the golden program-level facts +
      # 15 function addresses in expected-analysis.json. The OpenSSL static build is not
      # byte-reproducible across toolchains, so the exact bytes are pinned in LFS rather than rebuilt
      # (the test verifies the binary SHA-256 against the golden subject hash). Kept ADVISORY
      # (continue-on-error, separate JUnit not read by the fail-loud guard) until the analysis is
      # confirmed stable on the CI worker's Ghidra; function_count drift then prompts a re-gold.
      - name: Golden fixture (OpenSSL blind) — advisory
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_WORKER_IMAGE: ${{ steps.image.outputs.image }}
          VIVARIUM_CONTAINER_ENGINE: podman
          VIVARIUM_WORKER_RUNTIME: crun
          VIVARIUM_E2E_TIMEOUT: "1200"
          VIVARIUM_SESSION_TTL_SECONDS: "2400"
          VIVARIUM_SESSION_IDLE_SECONDS: "2400"
        run: |
          set -uo pipefail
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR"
          git lfs pull --include="samples/openssl-blind-analysis/openssl.blind" || true
          pytest -m integration --no-cov -v \
            --junit-xml=golden-fixture-junit.xml \
            tests/integration/test_golden_fixture_openssl_blind.py \
            tests/integration/test_analyze_progress_client.py \
            tests/integration/test_decompile_stream_openssl_blind.py \
            tests/integration/test_decompile_stream_cancel_latency.py || true

      - name: Upload golden-fixture JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: golden-fixture-junit
          path: golden-fixture-junit.xml
          if-no-files-found: ignore

      # --- ADVISORY: FID ELF bundled-DB match (ADR-043 Phase 2; PROMOTE to hard gate once bundled) -
      # A zlib-static ELF must match the BUNDLED zlib FID DB via the worker-startup attach. SKIPs
      # (advisory, continue-on-error — NOT read by the fail-loud hard-gate guard) until the PM
      # generates + bundles the zlib `.fidbf` into the worker image. zlib-dev provides libz.a so the
      # test can static-link a benign zlib program. PROMOTE to the hard-gate run + bump the >=5
      # expectation once the DB ships (see this workflow's header + the test's "DB not bundled" note).
      - name: FID ELF bundled-DB match (ADR-043) — advisory
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: src
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_WORKER_IMAGE: ${{ steps.image.outputs.image }}
          VIVARIUM_CONTAINER_ENGINE: podman
          VIVARIUM_WORKER_RUNTIME: crun
          VIVARIUM_E2E_TIMEOUT: "900"
          VIVARIUM_SESSION_TTL_SECONDS: "1800"
          VIVARIUM_SESSION_IDLE_SECONDS: "1800"
        run: |
          set -uo pipefail
          # zlib-dev (libz.a) so the test can static-link a benign zlib program for the DB to match.
          sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev || true
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_IMPORT_ROOT="/tmp/gmcp-imports"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR" "$VIVARIUM_IMPORT_ROOT"
          pytest -m integration --no-cov -v \
            --junit-xml=fid-elf-match-junit.xml \
            tests/integration/test_identify_functions_elf_match.py || true

      - name: Upload FID ELF match JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: fid-elf-match-junit
          path: fid-elf-match-junit.xml
          if-no-files-found: ignore

      # End-user status reporting (ADR-039): on completion, summarize every gate + the advisory
      # tests into the job summary and push the overall result to ntfy (if configured). `always()`
      # so it reports failures too. Reads the hard-gate + advisory JUnit reports written above.
      - name: Report run status
        if: always()
        env:
          STATUS_NTFY_URL: ${{ secrets.STATUS_NTFY_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          summarize() {  # $1=junit file  $2=label  -> echoes "label: N tests, F failed, E errors, S skipped"
            python3 - "$1" "$2" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path, label = sys.argv[1], sys.argv[2]
          import os
          if not os.path.exists(path):
              print(f"{label}: (no report)"); raise SystemExit
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:  # noqa: BLE001 — report parse failure, never crash the notifier
              print(f"{label}: (unparseable: {exc})"); raise SystemExit
          t = f = e = s = 0
          for suite in (list(root.iter("testsuite")) or [root]):
              t += int(suite.get("tests", 0)); f += int(suite.get("failures", 0))
              e += int(suite.get("errors", 0)); s += int(suite.get("skipped", 0))
          print(f"{label}: {t} tests, {f} failed, {e} errors, {s} skipped")
          PY
          }
          HARD=$(summarize live-regression-junit.xml "Hard gates")
          ADV=$(summarize golden-fixture-junit.xml "Advisory (golden + progress)")
          ICON="white_check_mark"; STATE="notice"
          [ "${JOB_STATUS}" != "success" ] && { ICON="x"; STATE="error"; }
          {
            echo "## live-regression: ${JOB_STATUS}"
            echo ""
            echo "- ${HARD}"
            echo "- ${ADV}"
            echo "- [run log](${RUN_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"
          MSG="${JOB_STATUS} — ${HARD}; ${ADV}"
          echo "::${STATE}::live-regression ${JOB_STATUS} — ${HARD}; ${ADV}"
          if [ -n "${STATUS_NTFY_URL}" ]; then
            curl -fsS --max-time 15 \
              -H "Title: vivarium live-regression" \
              -H "Priority: $([ "${JOB_STATUS}" = success ] && echo default || echo high)" \
              -H "Tags: ${ICON}" \
              --data-binary "${MSG} — ${RUN_URL}" \
              "${STATUS_NTFY_URL}" >/dev/null 2>&1 || echo "::warning::status push to ntfy failed (non-fatal)"
          fi

  # ===============================================================================================
  # fid-elf-match-gate — the ALWAYS-RUN required status check for branch protection.
  # ===============================================================================================
  # The `live-regression` job is conditionally SKIPPED on PRs (it auto-runs only on a SAME-REPO PR
  # that touches a FID path, or ANY PR carrying the `live-regression` label). Pointing a required
  # status check straight at a job that can be skipped is fragile: GitHub's "skipped == neutral"
  # handling for required checks is inconsistent and can leave a non-FID PR blocked on a Pending
  # check. This tiny job instead runs on EVERY PR (`if: always()`) and posts a DETERMINISTIC status,
  # so it is safe to mark as the single required check for the FID real-worker gate:
  #   * no FID-path change  -> the real-worker gate is N/A -> PASS (green); non-FID PRs never block.
  #   * FID-path change      -> the `live-regression` job MUST have run AND succeeded, else FAIL. For
  #                             a FORK PR (where `live-regression` is auto-skipped by the same-repo
  #                             fork-hardening guard, #161/#162) this stays RED until a maintainer
  #                             applies the `live-regression` label to run the real-worker suite — the
  #                             gate ENFORCES the human-in-the-loop, it does not bypass it.
  # FAIL-SAFE: a broken `changes` detector (job-level failure) is treated as a FID change, mirroring
  # the live-regression job's own fail-safe — the gate errs toward REQUIRING the run, never skipping.
  # Keyed off `needs.changes.outputs.fid`, computed by the `changes` job for ALL PRs (incl. forks) via
  # a self-contained git diff. Branch protection evaluates required checks only on PRs, so the
  # schedule/dispatch paths (where `changes` is skipped) are irrelevant here.
  fid-elf-match-gate:
    name: fid-elf-match-gate
    needs: [changes, live-regression]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # least privilege; reads only the needs.* results, nothing is pushed
    steps:
      - name: Decide the FID real-worker gate
        env:
          FID_CHANGED: ${{ needs.changes.outputs.fid }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIVE_RESULT: ${{ needs.live-regression.result }}
        run: |
          set -euo pipefail
          # Gate applies when a FID path changed OR the detector itself failed (fail-safe).
          if [ "${CHANGES_RESULT}" != "failure" ] && [ "${FID_CHANGED}" != "true" ]; then
            echo "::notice::no FID-path change on this PR — live-regression real-worker gate N/A (pass)"
            exit 0
          fi
          echo "FID-path change (or broken detector) — requiring the real-worker live-regression gate"
          if [ "${LIVE_RESULT}" != "success" ]; then
            echo "::error::FID paths changed but the live-regression real-worker gate did not pass" \
                 "(result=${LIVE_RESULT}). For a fork PR a maintainer must apply the 'live-regression'" \
                 "label to run it before merge."
            exit 1
          fi
          echo "::notice::live-regression real-worker gate passed — FID gate satisfied"
