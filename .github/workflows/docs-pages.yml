# =============================================================================
# docs-pages.yml — render docs/ to the GitHub Pages site (MkDocs + Material)
# =============================================================================
# Builds the Markdown under docs/ into a static site and publishes it to GitHub
# Pages. NOT a merge gate: it validates the build on PRs (no deploy, least-priv)
# and deploys only on push to main / manual dispatch. Actions are pinned by commit
# SHA and docs deps install from the hash-pinned requirements-docs.lock (the repo's
# supply-chain idiom). The rendered site is public docs only — it contains no
# secrets and reads only the already-public repository.
name: docs-pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.lock
      - .github/workflows/docs-pages.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.lock
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

# Serialize Pages publishes; do NOT cancel an in-flight deploy (GitHub's guidance).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Install docs dependencies (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-docs.lock
      - name: Build site
        run: mkdocs build --site-dir ./site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    # Publish only from main (or a manual dispatch) — never from a pull request.
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # OIDC token the deploy-pages action exchanges
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4
