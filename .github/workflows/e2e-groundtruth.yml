# =============================================================================
# e2e-groundtruth.yml — full ground-truth e2e on real OSS binaries (WS5; GATED, on-demand)
# =============================================================================
# A known-answer sanity check: build 3 source-available Linux tools (cJSON / coreutils `wc` /
# util-linux `col`) WITH DWARF + non-PIE, extract a call-graph GROUND TRUTH from the unstripped
# build, STRIP a copy, then drive the real MCP stdio server → real hardened Ghidra worker on the
# stripped copy and assert Ghidra's recovered functions/edges/leaf-first order match the truth
# (within tolerance). The pure scorer + extractor are unit-tested hermetically in ci.yml; THIS
# workflow exercises the real, gated chain (network source build + a signed-worker container run).
#
# GATED (PLAN §6, std-supplychain): manual dispatch only. Source tarballs are SHA-256-pinned in
# tests/fixtures/oss/manifest.toml (build fails closed on a mismatch). Actions are pinned BY DIGEST.
# The worker image is pulled BY DIGEST (vars.WORKER_IMAGE_DIGEST — the signed digest from the most
# recent worker-image.yml run) and cosign-verified before it is trusted/run.
name: e2e-groundtruth

on:
  workflow_dispatch: {}        # manual, gated trigger only.

permissions:
  contents: read

concurrency:
  group: e2e-groundtruth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: build the ground-truth fixtures from pinned source, then drive the real stdio server
  # → real worker on them. Combining avoids an artifact handoff and keeps the pin surface minimal.
  groundtruth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # pull the worker image from GHCR.
      id-token: write           # cosign keyless verify of the pulled image.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain + package (e2e extras) + fixtures-build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential xz-utils binutils skopeo
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyelftools capstone   # (pin via a lock before first real run)

      - name: Build ground-truth fixtures (fetch + verify sha256 + build -g -no-pie + truth + strip)
        run: |
          set -euo pipefail
          python tests/fixtures/oss/build_fixtures.py --out "$GITHUB_WORKSPACE/_fixtures" --jobs 2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # sigstore/cosign-installer@v3.7.0

      - name: Verify + pull the signed worker image (by digest)
        env:
          WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/ghidra-mcp-worker@${{ vars.WORKER_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          if [ -z "${{ vars.WORKER_IMAGE_DIGEST }}" ]; then
            echo "::error::vars.WORKER_IMAGE_DIGEST is unset — set it to the signed worker digest" >&2
            exit 1
          fi
          # Keyless cosign verify scoped to THIS repo's worker-image.yml OIDC identity before trust.
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/worker-image.yml@" \
            "$WORKER_IMAGE"
          podman pull "$WORKER_IMAGE"
          echo "GHIDRA_MCP_WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

      # TEMP DIAGNOSTIC (remove once the runner-fit cause is pinned): the gated e2e fails on
      # GitHub-hosted runners with the worker spawning but the RPC dying ~10s in (worker-unavailable),
      # while the same images pass locally. The adapter --rm's the worker so its logs are lost. This
      # step runs the worker STANDALONE (no --rm) with the launcher's exact hardening, then dumps its
      # own logs + exit/OOM state + runner memory so we see WHY it dies (suspected JVM OOM under
      # --memory 4g, or a rootless/crun limit). continue-on-error so it never blocks the real e2e.
      - name: Diagnose worker on the runner (standalone smoke, no --rm)
        continue-on-error: true
        run: |
          set -uxo pipefail
          echo "## runner resources"; free -m || true; nproc || true
          podman info --format 'cgroups={{.Host.CgroupsVersion}} mgr={{.Host.CgroupManager}} oci={{.Host.OCIRuntime.Name}} rootless={{.Host.Security.Rootless}} memTotal={{.Host.MemTotal}}' || true
          sid=diag; sess="${RUNNER_TEMP:-/tmp}/ghidra-run/$sid"; rm -rf "$sess"; mkdir -p "$sess"; chmod 700 "$sess"
          src="${GITHUB_WORKSPACE}/_fixtures/cjson.stripped"
          podman rm -f "w-$sid" >/dev/null 2>&1 || true
          podman run --name "w-$sid" --detach --runtime crun --network none \
            --user "$(id -u):$(id -g)" --userns keep-id --cap-drop ALL \
            --security-opt no-new-privileges --read-only \
            --tmpfs /tmp/ghidra:rw,noexec,nosuid,nodev,mode=1777,size=2g \
            --tmpfs /work/project:rw,noexec,nosuid,nodev,mode=1777,size=4g \
            --memory 4g --memory-swap 4g --cpus 2 --pids-limit 512 --oom-kill-disable=false \
            --volume "$sess":/run/ghidra-mcp:rw,Z \
            --volume "${GITHUB_WORKSPACE}/_fixtures":"${GITHUB_WORKSPACE}/_fixtures":ro,Z \
            --env GHIDRA_MCP_SESSION_ID="$sid" --env GHIDRA_MCP_RPC_SOCKET_DIR=/run/ghidra-mcp \
            --env GHIDRA_MCP_ANALYSIS_TIMEOUT_SECONDS=600 --env-host=false \
            "$GHIDRA_MCP_WORKER_IMAGE" || echo "RUN_RC=$?"
          for i in $(seq 1 20); do [ -S "$sess/$sid.sock" ] && { echo "socket bound after ~${i}x0.5s"; break; }; sleep 0.5; done
          echo "## container state (post-bind)"; podman ps -a --filter "name=w-$sid" --format '{{.Status}}'
          # The decisive probe: drive the REAL RPC round-trip (ping -> import -> analyze ->
          # list_functions) against the worker on THIS runner, using the package's own framing,
          # with per-call timing. This reproduces the local probe that passes; if it fails here we
          # see exactly which call/readiness step breaks on the runner (vs the bind, which is fine).
          SHA=$(jq -r '.tools[]|select(.tool=="cjson").stripped_sha256' "${GITHUB_WORKSPACE}/_fixtures/index.json")
          GMCP_SOCK="$sess/$sid.sock" GMCP_SRC="$src" GMCP_SHA="$SHA" python - <<'PY' || echo "PROBE_RC=$?"
          import os, socket, time, json
          from ghidra_mcp.ghidra import rpc_framing as F
          sp=os.environ["GMCP_SOCK"]; mx=4194304
          def call(s,mid,m,p):
              s.sendall(F.encode_frame(F.build_request(mid,m,p),max_frame_bytes=mx)); pre=b""
              while len(pre)<4: pre+=s.recv(4-len(pre))
              n=F.decode_length_prefix(pre,max_frame_bytes=mx); b=b""
              while len(b)<n: b+=s.recv(n-len(b))
              return F.parse_response(F.decode_body(b),expected_id=mid)
          s=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM); s.settimeout(120)
          tc=time.monotonic(); s.connect(sp); print(f"connect: {time.monotonic()-tc:.2f}s", flush=True)
          steps=[("1","ping",{}),("2","import_binary",{"source_ref":os.environ["GMCP_SRC"],"expected_sha256":os.environ["GMCP_SHA"]}),("3","analyze",{}),("4","list_functions",{"offset":0,"limit":3})]
          for mid,m,p in steps:
              t=time.monotonic()
              try: print(f"{m}: OK {time.monotonic()-t:.1f}s -> {json.dumps(call(s,mid,m,p))[:200]}", flush=True)
              except Exception as e: print(f"{m}: ERR {time.monotonic()-t:.1f}s -> {type(e).__name__}: {e}", flush=True); break
          PY
          echo "## state (post-probe)"; podman ps -a --filter "name=w-$sid" --format '{{.Status}}'
          echo "## inspect (OOM/exit)"; podman inspect "w-$sid" -f 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' || true
          echo "## worker logs >>>"; podman logs "w-$sid" 2>&1 | tail -60 || true
          echo "## <<< worker logs"
          podman rm -f "w-$sid" >/dev/null 2>&1 || true

      - name: Run ground-truth e2e (gated real-worker suite)
        env:
          GHIDRA_MCP_INTEGRATION: "1"
          GHIDRA_MCP_FIXTURES: ${{ github.workspace }}/_fixtures
          GHIDRA_MCP_CONTAINER_ENGINE: podman
          # This is a CORRECTNESS ground-truth gate (does Ghidra recover the call graph), not an
          # isolation-tier test. Stock GitHub runners have no gVisor (runsc) — the production
          # strong-isolation runtime (ADR-004) — so run under crun (podman's default OCI runtime,
          # always present). The OCI runtime does not change Ghidra's recovered output; the gVisor
          # tier is validated separately at deploy. Without this the worker spawn fails fast
          # (`--runtime runsc` rejected) → every tool returns worker-unavailable.
          GHIDRA_MCP_WORKER_RUNTIME: crun
          GHIDRA_MCP_E2E_TIMEOUT: "900"
        run: |
          set -euo pipefail
          # The e2e drives a HOST-run server (not containerized). Under rootless podman + --userns
          # keep-id the worker must run as THIS runner's uid/gid to write the server-created
          # per-session socket dir (0700), and that dir must be a user-writable path (not /run).
          # In production the server is itself containerized as 65532 and these stay at their
          # hardened defaults (deploy/socket-dir.md, ADR-009).
          export GHIDRA_MCP_RPC_SOCKET_DIR="${RUNNER_TEMP:-/tmp}/ghidra-run"
          export GHIDRA_MCP_WORKER_UID="$(id -u)"
          export GHIDRA_MCP_WORKER_GID="$(id -g)"
          mkdir -p "$GHIDRA_MCP_RPC_SOCKET_DIR"
          pytest tests/e2e/test_groundtruth_oss.py -m integration -v --no-cov
