# =============================================================================
# e2e-groundtruth.yml — full ground-truth e2e on real OSS binaries (WS5; GATED, on-demand)
# =============================================================================
# A known-answer sanity check: build 3 source-available Linux tools (cJSON / coreutils `wc` /
# util-linux `col`) WITH DWARF + non-PIE, extract a call-graph GROUND TRUTH from the unstripped
# build, STRIP a copy, then drive the real MCP stdio server → real hardened Ghidra worker on the
# stripped copy and assert Ghidra's recovered functions/edges/leaf-first order match the truth
# (within tolerance). The pure scorer + extractor are unit-tested hermetically in ci.yml; THIS
# workflow exercises the real, gated chain (network source build + a signed-worker container run).
#
# It then runs the NAMING-EVAL e2e (ADR-010): drive the same server→worker chain to pull the
# leaf-first plan + per-function context via the read-only tools, run the pure orchestration loop
# with a deterministic stub namer, and MEASURE the assembled translation unit by compiling it in a
# worker-style sandbox (ContainerCompileRunner / TB5) — proving the whole tools→loop→compile→metrics
# machinery end to end. The compiler image is pinned BY DIGEST (std-supplychain).
#
# GATED (PLAN §6, std-supplychain): manual dispatch only. Source tarballs are SHA-256-pinned in
# tests/fixtures/oss/manifest.toml (build fails closed on a mismatch). Actions are pinned BY DIGEST.
# The worker image is pulled BY DIGEST (from .github/worker-image.pin — the signed digest
# auto-bumped via a reviewed PR by worker-image.yml on release) and cosign-verified before trust.
name: e2e-groundtruth

on:
  workflow_dispatch: {}        # manual, gated trigger only.

permissions:
  contents: read

concurrency:
  group: e2e-groundtruth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: build the ground-truth fixtures from pinned source, then drive the real stdio server
  # → real worker on them. Combining avoids an artifact handoff and keeps the pin surface minimal.
  groundtruth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # pull the worker image from GHCR.
      id-token: write           # cosign keyless verify of the pulled image.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain + package (e2e extras) + fixtures-build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential xz-utils binutils skopeo
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Fixture-build toolchain (pyelftools, capstone), hash-pinned (std-supplychain).
          # Regenerate: pip-compile --generate-hashes -o requirements-groundtruth.lock requirements-groundtruth.in
          pip install --require-hashes -r requirements-groundtruth.lock

      - name: Build ground-truth fixtures (fetch + verify sha256 + build -g -no-pie + truth + strip)
        run: |
          set -euo pipefail
          python tests/fixtures/oss/build_fixtures.py --out "$GITHUB_WORKSPACE/_fixtures" --jobs 2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # sigstore/cosign-installer@v3.7.0

      - name: Verify + pull the signed worker image (by digest)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          # Legacy fallback only — the trusted pin is the committed file .github/worker-image.pin
          # (auto-bumped by a reviewed PR from worker-image.yml on release).
          WORKER_IMAGE_DIGEST_VAR: ${{ vars.WORKER_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          # Single source of truth: the committed pin file; fall back to the legacy repo variable.
          PIN_FILE=".github/worker-image.pin"
          DIGEST=""
          if [ -f "${PIN_FILE}" ]; then
            DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' "${PIN_FILE}" | head -n1 || true)"
          fi
          [ -z "${DIGEST}" ] && DIGEST="${WORKER_IMAGE_DIGEST_VAR:-}"
          if [ -z "${DIGEST}" ]; then
            echo "::error::no worker-image pin (.github/worker-image.pin / vars.WORKER_IMAGE_DIGEST)" >&2
            exit 1
          fi
          WORKER_IMAGE="ghcr.io/${OWNER}/vivarium-worker@${DIGEST}"
          # Keyless cosign verify scoped to THIS repo's worker-image.yml OIDC identity before trust.
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/worker-image.yml@" \
            "$WORKER_IMAGE"
          podman pull "$WORKER_IMAGE"
          echo "VIVARIUM_WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Run ground-truth e2e (gated real-worker suite)
        env:
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_FIXTURES: ${{ github.workspace }}/_fixtures
          VIVARIUM_CONTAINER_ENGINE: podman
          # This is a CORRECTNESS ground-truth gate (does Ghidra recover the call graph), not an
          # isolation-tier test. Stock GitHub runners have no gVisor (runsc) — the production
          # strong-isolation runtime (ADR-004) — so run under crun (podman's default OCI runtime,
          # always present). The OCI runtime does not change Ghidra's recovered output; the gVisor
          # tier is validated separately at deploy. Without this the worker spawn fails fast
          # (`--runtime runsc` rejected) → every tool returns worker-unavailable.
          VIVARIUM_WORKER_RUNTIME: crun
          VIVARIUM_E2E_TIMEOUT: "900"
        run: |
          set -euo pipefail
          # The e2e drives a HOST-run server (not containerized). Under rootless podman + --userns
          # keep-id the worker must run as THIS runner's uid/gid to write the server-created
          # per-session socket dir (0700), and that dir must be a user-writable path (not /run).
          # In production the server is itself containerized as 65532 and these stay at their
          # hardened defaults (deploy/socket-dir.md, ADR-009).
          # Keep the socket dir SHORT: the per-session UDS path must fit AF_UNIX (~107 bytes); a
          # long RUNNER_TEMP prefix + the session id overflowed it. /tmp is writable on the runner.
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR"
          pytest tests/e2e/test_groundtruth_oss.py -m integration -v --no-cov

      - name: Run abuse e2e (TB3 containment + TB7 composite/structural/batch — G4 Phase 1/B1/B2/B3)
        env:
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_FIXTURES: ${{ github.workspace }}/_fixtures
          VIVARIUM_CONTAINER_ENGINE: podman
          VIVARIUM_WORKER_RUNTIME: crun     # no gVisor on stock runners — see note above.
          VIVARIUM_E2E_TIMEOUT: "900"
        run: |
          set -euo pipefail
          # Same host-run-server / rootless-keep-id constraints as the ground-truth step above:
          # short socket dir for AF_UNIX, worker runs as this runner's uid/gid (ADR-009). The abuse
          # tests reuse the already-built OSS fixtures (cases 7/8/1) + synthetic blobs they write to
          # tmp (cases 3/4); they set per-test server env (low cap / tiny timeout / low size cap).
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR"
          pytest tests/e2e/test_abuse_containment_oss.py tests/e2e/test_abuse_composite_oss.py \
            tests/e2e/test_abuse_structural_oss.py tests/e2e/test_abuse_batch_oss.py \
            -m "integration and abuse" -v --no-cov

      - name: Run naming-eval e2e (reference loop + sandboxed compile; ADR-010 / TB5)
        env:
          VIVARIUM_INTEGRATION: "1"
          VIVARIUM_FIXTURES: ${{ github.workspace }}/_fixtures
          VIVARIUM_CONTAINER_ENGINE: podman
          VIVARIUM_WORKER_RUNTIME: crun     # no gVisor on stock runners — see note above.
          VIVARIUM_E2E_TIMEOUT: "900"
          # The compile sandbox (TB5) needs a C compiler image, pinned BY DIGEST + immutable
          # (std-supplychain). Public docker.io gcc digest (multi-arch; resolves on amd64 runners).
          VIVARIUM_COMPILER_IMAGE: docker.io/library/gcc@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15
        run: |
          set -euo pipefail
          # Same host-run-server / rootless-keep-id constraints as the ground-truth step above:
          # short socket dir for AF_UNIX, worker runs as this runner's uid/gid (ADR-009).
          export VIVARIUM_RPC_SOCKET_DIR="/tmp/gmcp-run"
          export VIVARIUM_WORKER_UID="$(id -u)"
          export VIVARIUM_WORKER_GID="$(id -g)"
          mkdir -p "$VIVARIUM_RPC_SOCKET_DIR"
          # Pre-pull the pinned compiler image so the timed sandbox run isn't racing the pull.
          podman pull "$VIVARIUM_COMPILER_IMAGE"
          pytest tests/e2e/test_naming_eval_oss.py -m integration -v --no-cov
