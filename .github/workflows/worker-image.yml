# =============================================================================
# worker-image.yml — build + scan + SBOM + sign the vivarium container images (WS3)
# =============================================================================
# Separate from ci.yml (PR gates) — this is the IMAGE supply-chain pipeline (std-supplychain):
# build the worker + server images, Trivy IMAGE scan (vuln+misconfig+secret), generate a CycloneDX
# SBOM per image, and sign image + SBOM with cosign/Sigstore provenance. ci.yml's
# `container-iac-scan` already covers IaC/config scanning on PRs; this covers the built IMAGES.
#
# Runs on demand + on release tags (NOT every PR — image builds pull bases + the Ghidra release,
# which is a GATED supply-chain action; this workflow only runs once digests are pinned/approved).
#
# SUPPLY CHAIN (std-supplychain): every action is pinned BY COMMIT DIGEST (@<sha>) using the SAME
# REPLACE_WITH_DIGEST_FOR_<tag> placeholder convention as ci.yml — a maintainer resolves each to its
# SHA as a GATED step before this workflow runs. Image bases are pinned by digest in the Containerfiles.
name: worker-image

on:
  workflow_dispatch:          # manual, gated trigger (after digests/lock approved).
  push:
    tags: ["v*"]              # build + sign on release tags.

permissions:
  contents: read              # least privilege; raised per-job only where needed.

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint the Dockerfiles before building (cheap, fail-fast).
  # ---------------------------------------------------------------------------
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: hadolint (worker + server Containerfiles)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Containerfile.worker
          config: infra/hadolint.yaml
          failure-threshold: warning
      - name: hadolint (server)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Containerfile.server
          config: infra/hadolint.yaml
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # Build, scan, SBOM, sign — per image (worker, then server reuse via matrix).
  # ---------------------------------------------------------------------------
  build-scan-sign:
    needs: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR.
      id-token: write          # cosign keyless (OIDC) signing — no long-lived keys.
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: worker
            containerfile: Containerfile.worker
            image: ghcr.io/${{ github.repository_owner }}/vivarium-worker
          - name: server
            containerfile: Containerfile.server
            image: ghcr.io/${{ github.repository_owner }}/vivarium-server
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push by DIGEST (provenance + SBOM attestation produced by Buildx where supported).
      # NOTE: the worker build needs the Ghidra release ARGs (version/url/sha256) — supplied as
      # GATED, vetted repo/org variables, NOT secrets in source (they are non-secret but pinned).
      - name: Build + push (${{ matrix.name }})
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          provenance: true          # SLSA provenance attestation (pushed to the registry).
          sbom: true                # build-time SBOM attestation (pushed to the registry).
          build-args: |
            GHIDRA_VERSION=${{ vars.GHIDRA_VERSION }}
            GHIDRA_RELEASE_TAG=${{ vars.GHIDRA_RELEASE_TAG }}
            GHIDRA_ZIP_URL=${{ vars.GHIDRA_ZIP_URL }}
            GHIDRA_ZIP_SHA256=${{ vars.GHIDRA_ZIP_SHA256 }}

      # Export the EXACT pushed-by-digest artifact as a docker-archive for Trivy to scan locally
      # (PR #3 review, Low-1 — hardened). Instead of a second cache-built tarball (whose manifest
      # digest differs from the signed image, leaving the "scanned == shipped" binding resting on
      # buildx cache determinism), we `skopeo copy` the precise digest that `cosign` signs below.
      # `skopeo` resolves the pushed OCI image index to its single linux/amd64 runtime manifest and
      # writes a docker-archive (`manifest.json`) that `trivy --input` reads — so Trivy now inspects
      # the exact layers that were pushed AND signed, not a re-built equivalent.
      #
      # Why skopeo (not `docker pull`): the ~1.3 GB worker re-pull died on HTTP/2 PROTOCOL_ERROR;
      # skopeo speaks HTTP/1.1, retries, and copies straight to a local archive. It is preinstalled
      # on GitHub-hosted ubuntu runners; the guard installs it if absent (e.g. self-hosted).
      - name: Export pushed image (by digest) for scanning (${{ matrix.name }})
        env:
          IMAGE_REF: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          DEST: /tmp/image-${{ matrix.name }}.tar
          ARCHIVE_TAG: ${{ matrix.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y skopeo; }
          # --override-os/arch pin the single runtime image out of the pushed OCI index (which also
          # carries the SLSA/SBOM attestation manifest); docker-archive holds exactly one platform.
          skopeo copy --retry-times 3 --override-os linux --override-arch amd64 \
            "docker://${IMAGE_REF}" "docker-archive:${DEST}:${ARCHIVE_TAG}"

      # IMAGE vulnerability + misconfig + secret scan (gate #8 for the image). Fail on HIGH/CRITICAL.
      - name: Trivy image scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/image-${{ matrix.name }}.tar   # scan the locally-built tarball (no registry pull).
          trivy-config: infra/trivy.yaml
          trivyignores: .trivyignore.yaml   # time-boxed, justified, auto-expiring CVE waivers.
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "1"           # fail closed on HIGH/CRITICAL.
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif

      # CycloneDX SBOM per image (std-supplychain: SBOM per release artifact, stored with it).
      - name: Generate CycloneDX SBOM (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/image-${{ matrix.name }}.tar   # SBOM from the same locally-built tarball.
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json

      - name: Upload SBOM (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

      # Sign the image + attest the SBOM (cosign keyless via OIDC — no static keys; std-supplychain).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # sigstore/cosign-installer@v4.1.2
      - name: Sign image (keyless) + attest SBOM (${{ matrix.name }})
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          cosign attest --yes \
            --predicate sbom-${{ matrix.name }}.cdx.json \
            --type cyclonedx \
            "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

      # Publish the freshly SIGNED worker digest so the pin-bump job can propose advancing the
      # live-regression trust pin (.github/worker-image.pin) via a reviewed PR. Worker leg only —
      # the server image is not the regression subject. Artifact (not a matrix job output) to avoid
      # last-writer ambiguity across the worker/server matrix legs.
      - name: Record signed worker digest (worker only)
        if: ${{ matrix.name == 'worker' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s\n' "${DIGEST}" > worker-image.digest
          echo "recorded worker digest: ${DIGEST}"
      - name: Upload signed worker digest (worker only)
        if: ${{ matrix.name == 'worker' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: worker-image-digest
          path: worker-image.digest

  # ---------------------------------------------------------------------------
  # Isolation verification is a RUNTIME check (needs to run a container with --runtime runsc, no-net,
  # caps dropped). GitHub-hosted runners cannot run gVisor; this asserts the harness exists and
  # documents that ADR-004 acceptance runs on a gVisor-capable self-hosted runner / maintainer host.
  # Tracked as a follow-up; deploy/verify-isolation.sh is the harness.
  # ---------------------------------------------------------------------------
  isolation-verify-note:
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: ADR-004 isolation verification is a gVisor-capable-host step
        run: |
          echo "ADR-004 isolation checks (seccomp/caps/no-net/ro-rootfs/gVisor) run via"
          echo "deploy/verify-isolation.sh on a gVisor-capable host/self-hosted runner — NOT on"
          echo "the default GitHub runner (no runsc). See deploy/README.md step 3."
          test -x deploy/verify-isolation.sh || { echo "harness missing"; exit 1; }

  # ---------------------------------------------------------------------------
  # Propose advancing the live-regression trust pin to the freshly signed worker digest.
  # Runs only on release-tag pushes. Opens a REVIEWED PR that bumps .github/worker-image.pin — the
  # human merge is the gate (changing what CI trusts is a supply-chain decision, never auto-applied;
  # workflow-gated-actions). No-op if the pin is unchanged.
  #
  # Uses a GitHub App token (NOT the built-in GITHUB_TOKEN) — this fixes the two problems that made
  # the old bot-authored PR permanently unmergeable (round-6 repin-flow fix):
  #   1. SIGNED commit: the pin commit is created via the GitHub Contents API, so GitHub web-flow-
  #      SIGNS it (verified) — satisfying main's required-signatures rule (enforce_admins on). A
  #      local `git commit` here is authored by github-actions[bot] and UNSIGNED, so the merge is
  #      prohibited ("base branch policy prohibits the merge") even with every check green.
  #   2. Checks actually RUN: a PR opened with an App (or PAT) token triggers `pull_request` CI
  #      normally; a GITHUB_TOKEN-opened PR does NOT (GitHub loop-prevention), so the required
  #      contexts never report → permanent BLOCKED. A `workflow_dispatch` fallback can't fix it
  #      because fid-elf-match-gate / image-scan-gate are `if: event == pull_request`-only and skip
  #      on dispatch.
  #
  # SETUP (one-time, maintainer): create a GitHub App with repo permissions Contents: write +
  # Pull requests: write, install it on this repo, and store its credentials as repo secrets
  # REPIN_APP_ID + REPIN_APP_PRIVATE_KEY. Until those secrets exist this job SKIPS with a warning
  # (bump .github/worker-image.pin manually with a SIGNED commit). Setup: docs/runbooks/supply-chain-pinning.md.
  # ---------------------------------------------------------------------------
  propose-pin-bump:
    needs: build-scan-sign
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read           # the App token performs the writes; the job token only reads.
      actions: read            # download-artifact (same run).
      packages: read           # V6: pull the GHCR signature for the pre-PR cosign verify.
    steps:
      - name: Repin App configured?
        id: cfg
        env:
          APP_ID: ${{ secrets.REPIN_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.REPIN_APP_PRIVATE_KEY }}
        run: |
          # V3: require BOTH secrets to enable the auto-repin. Guarding on APP_ID alone let an
          # APP_ID-set-but-key-missing (or empty/malformed key) config bypass this clean skip and
          # HARD-FAIL the downstream `create-github-app-token` step — defeating the intended
          # graceful degradation. Gate on both so a partial config skips (with the warning) instead.
          if [ -n "${APP_ID}" ] && [ -n "${APP_PRIVATE_KEY}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::REPIN_APP_ID / REPIN_APP_PRIVATE_KEY not both set — skipping the" \
                 "auto-repin PR. Bump .github/worker-image.pin manually with a SIGNED commit, or" \
                 "provision the repin GitHub App (see this job's header comment)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the pin-rewrite script
        # Needed so scripts/bump_pin.sh (the tested trust-anchor transform, V2) is on disk. BEFORE
        # download-artifact so checkout's `git clean` cannot wipe the (untracked) digest artifact.
        # persist-credentials: false — this job pushes nothing via git; all writes go through the
        # App token over the Contents API (least privilege — no lingering GITHUB_TOKEN in .git).
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Download signed worker digest
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact@v8.0.1
        with:
          name: worker-image-digest
      - name: Install cosign
        if: steps.cfg.outputs.ok == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # sigstore/cosign-installer@v4.1.2
      - name: Log in to GHCR (read-only, for signature verify)
        if: steps.cfg.outputs.ok == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the signed worker digest (cosign) before proposing the pin
        # V6 defense-in-depth: verify the digest is THIS repo's worker-image.yml-signed image
        # BEFORE opening the trust-pin PR, so a wrong/tampered digest never reaches a reviewer. Runs
        # before the App token is minted (fail closed without acquiring write creds). Downstream
        # consumers verify again at pull; this fails it earlier + louder, at proposal time.
        if: steps.cfg.outputs.ok == 'true'
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' worker-image.digest | head -n1 || true)"
          if [ -z "${DIGEST}" ]; then
            echo "::error::no sha256 digest found in the worker-image-digest artifact"; exit 1
          fi
          IMAGE="ghcr.io/${OWNER}/vivarium-worker@${DIGEST}"
          if ! cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${REPO}/.github/workflows/worker-image.yml@" \
              "${IMAGE}" >/dev/null; then
            echo "::error::cosign verify FAILED for ${IMAGE} — refusing to propose an unverified" \
                 "trust pin (possible supply-chain tampering)."
            exit 1
          fi
          echo "::notice::cosign-verified ${IMAGE} — safe to propose the pin bump."
      - name: Mint the repin GitHub App token
        id: app
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.REPIN_APP_ID }}
          private-key: ${{ secrets.REPIN_APP_PRIVATE_KEY }}
      - name: Open a SIGNED trust-pin bump PR (Contents API commit + App-token PR)
        if: steps.cfg.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          PIN_FILE=".github/worker-image.pin"
          DIGEST="$(grep -oiE 'sha256:[0-9a-f]{64}' worker-image.digest | head -n1 || true)"
          if [ -z "${DIGEST}" ]; then
            echo "::error::no sha256 digest found in the worker-image-digest artifact"; exit 1
          fi
          BRANCH="ci/bump-worker-pin-${TAG}"
          main_sha="$(gh api "repos/${REPO}/git/ref/heads/${DEFAULT_BRANCH}" --jq .object.sha)"
          # Create the bump branch off the default-branch head FIRST (reset it if a prior attempt left
          # one), THEN read + write the pin file relative to THAT branch. Reading the blob sha from the
          # branch we just created — not from the default branch before creating it — makes the sha
          # used for the Contents PUT always consistent with the branch head, eliminating the 409 race
          # where `main` advanced between reading the sha and the PUT (O5). `concurrency:
          # cancel-in-progress` serializes runs per ref, so the branch head is stable across these calls.
          gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="${main_sha}" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" -f sha="${main_sha}" -F force=true >/dev/null
          # Read the current pin FROM THE BUMP BRANCH (need its blob sha to update it).
          cur="$(gh api "repos/${REPO}/contents/${PIN_FILE}?ref=${BRANCH}")"
          cur_sha="$(printf '%s' "${cur}" | jq -r .sha)"
          cur_txt="$(printf '%s' "${cur}" | jq -r .content | base64 -d)"
          CURRENT="$(printf '%s' "${cur_txt}" | grep -oiE 'sha256:[0-9a-f]{64}' | head -n1 || true)"
          if [ "${DIGEST}" = "${CURRENT}" ]; then
            echo "::notice::worker-image pin already at ${DIGEST} — no bump needed"; exit 0
          fi
          # New content: preserve the header, replace the digest line (single trailing newline).
          # Delegated to the extracted, unit-tested transform (V2 — tests/unit/test_bump_pin.py) so
          # this trust-anchor rewrite is not untested inline shell; it fails closed on a bad digest.
          new_txt="$(printf '%s' "${cur_txt}" | ./scripts/bump_pin.sh "${DIGEST}")"
          # Commit via the Contents API → GitHub SIGNS the resulting commit (verified → satisfies the
          # required-signatures branch rule, which a local bot `git commit` cannot).
          gh api -X PUT "repos/${REPO}/contents/${PIN_FILE}" \
            -f message="ci(supply-chain): bump worker-image trust pin to ${TAG} (${DIGEST})" \
            -f branch="${BRANCH}" \
            -f sha="${cur_sha}" \
            -f content="$(printf '%s\n' "${new_txt}" | base64 -w0)" >/dev/null
          # Open the PR with the APP token → pull_request CI runs (App/PAT events trigger workflows).
          gh pr create --base "${DEFAULT_BRANCH}" --head "${BRANCH}" \
            --title "ci: bump worker-image trust pin to ${TAG}" \
            --body "Automated by worker-image.yml on release \`${TAG}\` (signed via the repin GitHub App).

          Advances the live-regression trust pin (\`.github/worker-image.pin\`) to the freshly
          built+signed worker image digest \`${DIGEST}\`.

          **Review before merge** (supply-chain trust change): confirm this digest matches the
          cosign-signed worker image from this release's worker-image run. Merging advances what
          live-regression's default verify-and-pull path trusts.

          The commit is GitHub-signed (Contents API) and this PR runs the full required-check set
          under the App actor, so it reaches green + mergeable with no manual reopen or re-commit."
