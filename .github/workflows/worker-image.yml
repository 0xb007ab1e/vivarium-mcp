# =============================================================================
# worker-image.yml — build + scan + SBOM + sign the ghidra-mcp container images (WS3)
# =============================================================================
# Separate from ci.yml (PR gates) — this is the IMAGE supply-chain pipeline (std-supplychain):
# build the worker + server images, Trivy IMAGE scan (vuln+misconfig+secret), generate a CycloneDX
# SBOM per image, and sign image + SBOM with cosign/Sigstore provenance. ci.yml's
# `container-iac-scan` already covers IaC/config scanning on PRs; this covers the built IMAGES.
#
# Runs on demand + on release tags (NOT every PR — image builds pull bases + the Ghidra release,
# which is a GATED supply-chain action; this workflow only runs once digests are pinned/approved).
#
# SUPPLY CHAIN (std-supplychain): every action is pinned BY COMMIT DIGEST (@<sha>) using the SAME
# REPLACE_WITH_DIGEST_FOR_<tag> placeholder convention as ci.yml — a maintainer resolves each to its
# SHA as a GATED step before this workflow runs. Image bases are pinned by digest in the Containerfiles.
name: worker-image

on:
  workflow_dispatch:          # manual, gated trigger (after digests/lock approved).
  push:
    tags: ["v*"]              # build + sign on release tags.

permissions:
  contents: read              # least privilege; raised per-job only where needed.

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint the Dockerfiles before building (cheap, fail-fast).
  # ---------------------------------------------------------------------------
  hadolint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: hadolint (worker + server Containerfiles)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Containerfile.worker
          config: infra/hadolint.yaml
          failure-threshold: warning
      - name: hadolint (server)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Containerfile.server
          config: infra/hadolint.yaml
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # Build, scan, SBOM, sign — per image (worker, then server reuse via matrix).
  # ---------------------------------------------------------------------------
  build-scan-sign:
    needs: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR.
      id-token: write          # cosign keyless (OIDC) signing — no long-lived keys.
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: worker
            containerfile: Containerfile.worker
            image: ghcr.io/${{ github.repository_owner }}/ghidra-mcp-worker
          - name: server
            containerfile: Containerfile.server
            image: ghcr.io/${{ github.repository_owner }}/ghidra-mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE build, TWO outputs (PR #3 review, Low-1 — scan the EXACT pushed artifact):
      #   * type=image,push=true → push to ghcr with SLSA provenance + SBOM attestations;
      #   * type=oci,dest=...     → export an OCI archive of the SAME build for Trivy to scan below.
      # The OCI exporter (unlike the docker exporter) carries manifest lists/attestations, so a single
      # provenance:true build can do both. Trivy then scans the byte-identical artifact that was
      # pushed — no registry re-pull (which died on HTTP/2 for the ~1.3 GB worker) and no second-build
      # cache-determinism assumption. The worker build needs the Ghidra release ARGs (version/url/
      # sha256), supplied as GATED, vetted repo/org variables — NOT secrets (non-secret but pinned).
      - name: Build + push + export OCI tarball for scanning (${{ matrix.name }})
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          outputs: |
            type=image,push=true
            type=oci,dest=/tmp/image-${{ matrix.name }}.tar
          provenance: true          # SLSA provenance attestation (pushed image + OCI archive).
          sbom: true                # build-time SBOM attestation.
          build-args: |
            GHIDRA_VERSION=${{ vars.GHIDRA_VERSION }}
            GHIDRA_RELEASE_TAG=${{ vars.GHIDRA_RELEASE_TAG }}
            GHIDRA_ZIP_URL=${{ vars.GHIDRA_ZIP_URL }}
            GHIDRA_ZIP_SHA256=${{ vars.GHIDRA_ZIP_SHA256 }}

      # IMAGE vulnerability + misconfig + secret scan (gate #8 for the image). Fail on HIGH/CRITICAL.
      - name: Trivy image scan (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/image-${{ matrix.name }}.tar   # OCI archive of the pushed build (scanned == shipped).
          trivy-config: infra/trivy.yaml
          trivyignores: .trivyignore.yaml   # time-boxed, justified, auto-expiring CVE waivers.
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "1"           # fail closed on HIGH/CRITICAL.
          severity: HIGH,CRITICAL

      - name: Upload Trivy SARIF (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif

      # CycloneDX SBOM per image (std-supplychain: SBOM per release artifact, stored with it).
      - name: Generate CycloneDX SBOM (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          input: /tmp/image-${{ matrix.name }}.tar   # SBOM from the same locally-built tarball.
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json

      - name: Upload SBOM (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

      # Sign the image + attest the SBOM (cosign keyless via OIDC — no static keys; std-supplychain).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # sigstore/cosign-installer@v4.1.2
      - name: Sign image (keyless) + attest SBOM (${{ matrix.name }})
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
          cosign attest --yes \
            --predicate sbom-${{ matrix.name }}.cdx.json \
            --type cyclonedx \
            "${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  # ---------------------------------------------------------------------------
  # Isolation verification is a RUNTIME check (needs to run a container with --runtime runsc, no-net,
  # caps dropped). GitHub-hosted runners cannot run gVisor; this asserts the harness exists and
  # documents that ADR-004 acceptance runs on a gVisor-capable self-hosted runner / maintainer host.
  # Tracked as a follow-up; deploy/verify-isolation.sh is the harness.
  # ---------------------------------------------------------------------------
  isolation-verify-note:
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: ADR-004 isolation verification is a gVisor-capable-host step
        run: |
          echo "ADR-004 isolation checks (seccomp/caps/no-net/ro-rootfs/gVisor) run via"
          echo "deploy/verify-isolation.sh on a gVisor-capable host/self-hosted runner — NOT on"
          echo "the default GitHub runner (no runsc). See deploy/README.md step 3."
          test -x deploy/verify-isolation.sh || { echo "harness missing"; exit 1; }
