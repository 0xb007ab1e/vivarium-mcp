# CI security gates (workflow-cicd). Every gate is MERGE-BLOCKING via branch protection
# (see docs/ci-cd.md). Fail closed: an errored/skipped security stage counts as failure.
#
# SUPPLY CHAIN (std-supplychain): all third-party actions are pinned BY COMMIT DIGEST (@<sha>),
# never by floating tag; the tag is kept in a trailing comment for readability. The pinned SHAs
# below are PLACEHOLDERS (`REPLACE_WITH_DIGEST_FOR_<tag>`) — a maintainer resolves each tag to its
# commit SHA and pins it as a GATED supply-chain step before this workflow runs (no network in WS0).
name: ci

on:
  # Manually/programmatically dispatchable so the worker-image `propose-pin-bump` job can trigger
  # these required checks on its own PR branch: a PR opened with the default GITHUB_TOKEN does NOT
  # auto-run `pull_request` workflows (GitHub loop-prevention), but `workflow_dispatch` DOES fire
  # even when invoked with GITHUB_TOKEN (the documented exception). The dispatched run posts the
  # same named check-runs onto the branch head SHA, satisfying branch-protection required checks.
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege; raise per-job only when a step needs it.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # 1-4. Build, lint+format, type-check, unit+coverage (>=90% line+branch baseline).
  quality:
    runs-on: ubuntu-latest
    # Run the package from `src/` (src-layout) instead of an editable install, so the install step
    # fetches NOTHING unpinned (an editable build would pull the `hatchling` backend, which is not in
    # the dev lock). PYTHONPATH/MYPYPATH cover pytest, mypy (files=["src","tests"]), and any spawned
    # `python -m vivarium`. Same pattern the integration suite already uses.
    env:
      PYTHONPATH: src
      MYPYPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (hash-pinned dev lockfile only — no unpinned fetch)
        run: |
          python -m pip install --upgrade pip
          # Hash-pinned dev deps ONLY (require-hashes); the package itself runs from `src/` via
          # PYTHONPATH (no editable install → no unpinned build-backend fetch).
          # requirements-dev.lock = `pip-compile --extra=dev --generate-hashes` (regenerate with the
          # runtime lock — see the Maintenance note in docs/roadmap-v1.5.md).
          pip install --require-hashes -r requirements-dev.lock
      - name: Lint + format (ruff)          # gate 2
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict)    # gate 3
        run: mypy
      - name: Unit tests + coverage         # gate 3 (master §4: >=90% line+branch baseline)
        run: pytest -m "not integration"
      - name: Critical-path coverage 100%   # master §4: 100% on designated critical paths
        run: |
          # Critical modules (see pyproject [tool.coverage] note): validation, envelope, errors,
          # sessions.manager, security.limits, server.auth. Enforce 100% SCOPED to these.
          # NOTE: pyproject `[tool.coverage.run] source = ["vivarium"]` forces whole-package
          # measurement, so `--cov=<module> --cov-fail-under=100` would (wrongly) gate the whole
          # package. Instead: measure once, then `coverage report --include=<the 6 files>
          # --fail-under=100` to gate exactly the critical paths.
          pytest -m "not integration" --cov=vivarium --cov-report=
          coverage report --fail-under=100 \
            --include='*/vivarium/core/validation.py,*/vivarium/core/envelope.py,*/vivarium/core/errors.py,*/vivarium/sessions/manager.py,*/vivarium/security/limits.py,*/vivarium/server/auth.py'
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.xml

  # 4b. Parity gate — the SERVER image runs on Chainguard/Wolfi Python 3.14 (PLAN §9 distroless
  # migration); the worker stays on 3.12. `requires-python = ">=3.12"` covers both, so the suite
  # MUST also pass on the server's 3.14 runtime (dev/prod parity — topic-config-environments). The
  # version-agnostic lint + the 3.12-min-targeted type-check stay in `quality`; this leg proves the
  # deps install and the tests pass on 3.14. `quality-py314` IS merge-blocking: it is one of the
  # branch-protection required status checks on `main` (alongside `quality`, `sast`, `sca`,
  # `secret-scan`, `container-iac-scan`, `fid-license-gate`, `fid-elf-match-gate`).
  quality-py314:
    runs-on: ubuntu-latest
    # Same src-layout / no-editable-install posture as `quality` (no unpinned build-backend fetch).
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: "3.14"
      - name: Install (hash-pinned dev lockfile only — no unpinned fetch)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Unit tests + coverage (server runtime — Python 3.14)
        run: pytest -m "not integration"

  # 5. SAST — first-party static analysis.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install scanners (hash-pinned — no unpinned fetch)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-sast.lock
      - name: bandit
        run: bandit -r src -c pyproject.toml
      - name: semgrep (block on high/critical)
        # Vendored rulesets (infra/semgrep/p-*.yml) — NOT the `p/...` registry shorthands, which
        # fetch rules from semgrep.dev at scan time (network egress + silent rule drift). Offline +
        # reproducible: --metrics=off and --disable-version-check suppress all network calls; refresh
        # the vendored rules deliberately via infra/semgrep/refresh.sh (v1.6 #5 supply-chain hardening).
        # Scan the WHOLE first-party tree (default .semgrepignore drops tests/) — same scope as the
        # prior no-target invocation, so worker/ + scripts/ keep SAST coverage (bandit only covers
        # src/). --exclude infra/semgrep so the rules don't self-match their own example snippets.
        run: semgrep --config infra/semgrep/ --error --metrics=off --disable-version-check --exclude infra/semgrep .

  # 6. SCA — dependency vulnerability scan (block on high/critical CVEs).
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit (hash-pinned — no unpinned fetch)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-sast.lock
      - name: pip-audit
        # Audit OUR hash-pinned runtime lockfile (the project's real dependency surface), not the
        # ambient runner env — otherwise it flags the runner's own pip/setuptools, which is noise.
        run: pip-audit --strict --desc --requirement requirements.lock

  # 6b. FID-DB source license gate (ADR-043 Phase 2 / D5; topic-license-compliance). Merge-blocking:
  # every bundled-FID-DB source (deploy/fid/sources.toml) must carry a PERMISSIVE SPDX id (allow-list
  # in vivarium.fid_licenses); a copyleft id (LGPL-*/GPL-*/AGPL-*/OpenSSL pre-3.0) FAILS the gate so
  # a copyleft source cannot enter the worker-image build without an explicit, reviewed waiver +
  # counsel sign-off (SPIKE-2 §5). Pure stdlib (tomllib) — no extra deps, no network.
  fid-license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: FID-DB source license allow-list gate
        env:
          PYTHONPATH: src
        # Runs from src/ (no editable install — nothing unpinned fetched). Fails closed on any
        # disallowed/copyleft/missing SPDX id in deploy/fid/sources.toml.
        run: python -m vivarium.fid_licenses

  # 7. Secret scan — block on any detected secret.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists PR commits via the API (else 403 on PRs)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
        with:
          fetch-depth: 0   # full history for the secret scanner
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # gitleaks/gitleaks-action@v3.0.0
        env:
          # gitleaks-action v3 requires GITHUB_TOKEN to scan PRs (uses the auto-provided token).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 8. Container / IaC scan — worker image + Dockerfiles/manifests (WS3). Runs once those exist.
  container-iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # actions/checkout@v6.0.3
      - name: Trivy config/IaC scan (misconfig + Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"     # fail closed on high/critical misconfig
      # NOTE: the worker IMAGE scan (Trivy image, pinned by digest) + SBOM generation run in the
      # WS3 build/release workflow once the worker image exists; this job covers IaC/config now.

  # Integration/E2E (real worker) run in a separate workflow (needs the built worker image),
  # NOT in PR CI — no image pulls / network here. Tracked for WS3/WS5.
