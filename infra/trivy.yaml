# Trivy config — image + IaC/misconfig + secret scanning for the vivarium images and deploy specs.
# Used by the WS3 worker-image workflow (.github/workflows/worker-image.yml) for IMAGE scans, and
# complements the existing ci.yml `container-iac-scan` job (which does config/IaC scanning).
#
# Fail-closed: HIGH + CRITICAL block (exit-code 1). std-supplychain / workflow-cicd gate #8.

# Severities that BLOCK (merge-blocking gate). Lower severities are reported, not blocked.
severity:
  - HIGH
  - CRITICAL

# Non-zero exit on any finding at the above severities (fail closed).
exit-code: 1

# Do not fail the pipeline merely because the vuln DB couldn't update; but DO fail on findings.
# (Set to false so a transient DB hiccup doesn't mask real findings by erroring the stage — a
#  skipped/errored security stage is itself treated as failure by CI orchestration.)
ignore-unfixed: false

scan:
  scanners:
    - vuln       # OS + language package CVEs (Ghidra deps, JDK, Python wheels) — the point of image scan
    - secret     # accidental secrets baked into image layers
    # `misconfig` is deliberately NOT run on the built IMAGE. Trivy's Dockerfile/IaC misconfig scanner
    # parses third-party files BUNDLED in the image — e.g. Ghidra ships
    # `opt/ghidra/docker/Dockerfile.dockerignore`, which Trivy 0.70 cannot parse and errors the whole
    # scan (exit 1). Our OWN Dockerfiles + deploy/IaC are misconfig-scanned at the SOURCE by ci.yml's
    # `container-iac-scan` (+ hadolint in worker-image.yml), so image-level misconfig is redundant.
    # workflow-cicd gate #8 (IaC/misconfig) coverage is preserved by that source scan.
  # Skip noisy paths that are not part of the shipped artifact.
  skip-dirs:
    - tests
    - .git
    - .claude

misconfiguration:
  # Scan our Dockerfiles + deploy specs for hardening misconfig (non-root, no-new-privileges, etc.).
  include-non-failures: false

# Vulnerability DB / Java DB are fetched at scan time (GATED network in CI; the action handles it).
# A maintainer pins the trivy-action by digest in worker-image.yml (REPLACE_WITH_DIGEST_FOR_*).

# Waivers live in `.trivyignore.yaml` (repo root) — TIME-BOXED, justified, owned, AUTO-EXPIRING CVE
# waivers ONLY, never a permanent ignore (workflow-cve-management). Each entry: CVE id + statement
# (VEX reachability + compensating controls) + `expired_at`. Wired via the `trivyignores:` input on
# the image-scan step in .github/workflows/worker-image.yml. NO active waivers (both images on
# Chainguard/Wolfi after the PLAN §9 distroless migration — Trivy HIGH,CRITICAL OS scan = 0 each;
# the former 6 Debian-base perl/ncurses waivers are retired). Add a future waiver only if needed.
