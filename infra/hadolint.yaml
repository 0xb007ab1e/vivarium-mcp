# hadolint config — Dockerfile linting for Containerfile.worker / Containerfile.server.
# Run (GATED — needs the hadolint binary): hadolint --config infra/hadolint.yaml Containerfile.*
#
# We deliberately keep almost everything as ERROR (fail-closed Dockerfile hygiene). A few narrow,
# justified relaxations only (see the `ignored` list); the builder-stage apt rules are also scoped
# via inline `# hadolint ignore=` in the Containerfile.

failure-threshold: warning

# Treat unpinned base images / apt versions strictly — but our bases are pinned BY DIGEST
# (REPLACE_WITH_DIGEST_FOR_* placeholders), which hadolint accepts as pinned.
# cgr.dev is the Chainguard registry: the worker + server runtime/builder stages are
# distroless Wolfi (`cgr.dev/chainguard/wolfi-base`, pinned by digest) — DL3026 requires it
# be explicitly trusted.
trustedRegistries:
  - docker.io
  - ghcr.io
  - cgr.dev

# Ignored rules (each justified):
ignored:
  # DL3008: pin apt versions. Build-stage only (ca-certificates/curl/unzip), and those packages
  #         are stripped from the runtime stage entirely. Version-pinning distro packages in a
  #         throwaway builder adds churn for no runtime supply-chain benefit (the runtime image
  #         carries none of them). Scoped to the builder via inline ignore in the Containerfile.
  - DL3008
  # DL3009: delete apt lists. We DO clean lists; this is belt-and-suspenders for the builder stage
  #         where layers are discarded anyway. Scoped via inline ignore.
  - DL3009
  # DL3013: pin pip versions with `==`. This project pins its Python supply chain the STRONGER way —
  #         the runtime install uses `--require-hashes -r requirements.lock` (hash-pinned), the
  #         vivarium wheel + bundled PyGhidra install offline via `--no-index --find-links`
  #         (resolved from an already-SHA-256-verified Ghidra dist / a locally-built wheel), and the
  #         pybuilder's `build`/`hatchling` are throwaway build-only tooling. A bare `==` pin adds
  #         nothing over hashes + offline resolution, so DL3013 is a false positive for our install
  #         pattern. (The lockfile, not `==`, is the reproducibility control — std-supplychain.)
  - DL3013
  # DL3018: pin apk versions. The Wolfi apk equivalent of DL3008. By design the Wolfi bases install
  #         the CURRENT apk packages at build (`python-3.12`, `openjdk-21`, builder ca-certs/curl/
  #         unzip) — Wolfi ships rolling, auto-patched/CVE-clean packages, so pinning an exact
  #         `=<version>` would FREEZE us onto stale, CVE-bearing versions and defeat the reason we
  #         moved to Wolfi (see Containerfile.worker header). The digest-pinned base + rolling
  #         patched packages IS the supply-chain stance here; Trivy (infra/trivy.yaml) gates the
  #         resulting package set for CVEs. Consistent with DL3008 above.
  - DL3018

# Everything else (no-root-user checks, COPY/ADD hygiene, etc.) stays at default severity.
# Note: hadolint cannot see runtime hardening (USER is set; ro-rootfs/caps/seccomp/no-net are
# applied by deploy/ at RUN time, not in the Dockerfile) — see deploy/ + infra/trivy.yaml.
