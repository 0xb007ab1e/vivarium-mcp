<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vivarium Status</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#viewer">Skip to viewer</a>

    <header class="titlebar">
      <span class="tb-mark" aria-hidden="true">▣</span>
      <span class="tb-title">Vivarium</span>
      <span class="tb-sub">status</span>
      <span class="tb-spacer"></span>
      <span id="conn" class="tb-conn" role="status" aria-live="polite">connecting…</span>
      <span class="tb-ro" title="Read-only display surface">read-only</span>
    </header>

    <div class="workbench">
      <nav class="sidebar" aria-label="Explorer">
        <div class="side-head">Explorer</div>
        <div id="explorer" class="tree" role="tree" aria-label="Analysis artifacts"></div>
      </nav>

      <main class="editor" id="main">
        <div class="breadcrumb" id="crumb" aria-live="polite"></div>
        <section class="viewer" id="viewer" tabindex="-1" aria-label="Artifact viewer">
          <div class="empty" id="empty">
            <p class="empty-mark" aria-hidden="true">▣</p>
            <p>Select an artifact from the Explorer.</p>
            <p class="empty-sub">Sessions, binary format, imports, exports, strings, call graph, and decompiled output appear on the left as analysis streams in.</p>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar" id="status" aria-live="polite">
      <span id="status-left">idle</span>
      <span class="sb-spacer"></span>
      <span id="status-right">binary-derived output rendered inert (ADR-005)</span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
