# Bundled ELF FunctionID database source set + licenses (ADR-043 Phase 2 / D1, D5).
#
# Every library whose code is hashed into a shipped `.fidbf` MUST be listed here with its SPDX
# license id. A merge-blocking CI gate (`vivarium.fid_licenses`) asserts every `license_spdx` is in
# the PERMISSIVE allow-list {Zlib, MIT, Apache-2.0, BSL-1.0, BSD-2-Clause, BSD-3-Clause} and FAILS
# on any copyleft id (LGPL-*/GPL-*/AGPL-* / OpenSSL pre-3.0). A copyleft source cannot enter the
# build without an explicit, reviewed, time-boxed waiver + counsel sign-off (SPIKE-2 §5,
# docs/security/fid-database-licensing.md).
#
# The `.fidbf` itself contains only non-reversible hashes + lifted symbol names + metadata — NO
# library code/source (FLIRT "no code" rationale; SPIKE-2 §2). Attribution flows through NOTICE +
# the per-release SBOM. v1 ships x86-64 ELF DBs first (ADR-043 D7).
#
# `bundled = false` marks a source that is APPROVED + license-vetted but whose DB is not yet built
# into the image (the gate still validates its license; it just isn't a shipped artifact yet).

[[source]]
name = "zlib"
spdx = "Zlib"
# Ubiquitous compression; tiny, trivially reproducible — the v1 vertical-slice DB.
version = "1.3.1"
bundled = true

[[source]]
name = "musl"
spdx = "MIT"
# Static-libc identification workhorse + the glibc-role substitute (avoids the LGPL question).
version = "1.2.5"
bundled = false

[[source]]
name = "openssl"
spdx = "Apache-2.0"
# OpenSSL 3.0+ ONLY (Apache-2.0 — same license as our outbound). Pre-3.0 (`OpenSSL` id) is BLOCKED.
version = "3.5.0"
bundled = false

[[source]]
name = "boost"
spdx = "BSL-1.0"
# High value for C++ targets; permissive, no notice required for compiled redistribution.
version = "1.88.0"
bundled = false
